#
# Digital Voice Modem - SDR Software Configuration
#

# Flag indicating whether the host will run as a background or foreground task.
daemon: true

#
# Logging Configuration
#
#   Logging Levels:
#     1 - Debug
#     2 - Informational
#     3 - Warning
#     4 - Error
#     5 - Fatal
#
log:
    # Console display logging level (used when in foreground).
    displayLevel: 1
    # File logging level.
    fileLevel: 1
    # Flag indicating file logs should be sent to syslog instead of a file.
    useSyslog: false
    # Full path for the directory to store the log files.
    filePath: .
    # Log filename prefix.
    fileRoot: DVMSDR

#
# SDR RF Runtime Configuration
#
sdr:
    # osmosdr device selection string.
    # Format: "driver=<backend>[,key=value,...]"
    # Common backends include:
    #   - rtl            (RTL-SDR)
    #   - hackrf         (HackRF)
    #   - bladerf        (bladeRF)
    #   - airspy         (Airspy)
    #   - soapy          (SoapySDR bridge)
    #   - uhd            (USRP via UHD)
    #
    # Common selectors/keys (driver dependent):
    #   serial=..., index=..., device=..., type=..., addr=..., antenna=...
    #
    # Examples:
    #   RTL-SDR (first dongle):
    #     args: "driver=rtl,index=0"
    #   RTL-SDR (specific serial):
    #     args: "driver=rtl,serial=00000001"
    #   HackRF:
    #     args: "driver=hackrf"
    #   bladeRF by serial:
    #     args: "driver=bladerf,serial=5519595f67984f95"
    #   USRP over network:
    #     args: "driver=uhd,addr=192.168.10.2"
    #   Soapy LimeSDR:
    #     args: "driver=lime"
    #   Soapy bladeRF:
    #     args: "driver=bladerf,serial=5519595f67984f95"

    # Optional fallback values used when fields are omitted in individual devices.
    defaults:
        # Wideband sample rate used for channelization and multi-carrier operation.
        sampleRate: 960000

        # Gain controls (dB).
        rxGain: 30
        txGain: 30

        # Optional Soapy gain stage names.
        #rxGainElement: "LNA"
        #txGainElement: "VGA"

        # Optional Soapy bandwidth controls (Hz).
        #rxBandwidth: 300000
        #txBandwidth: 300000

        # Optional Soapy timing/clock source controls.
        #clockSource: "internal"
        #timeSource: "internal"

        # Center-frequency correction in PPM.
        freqCorrPpm: 0

        # Optional tuning center offsets (Hz) applied after center calculation.
        # Useful to shift active channels away from SDR DC spike at center.
        #rxCenterOffsetHz: 0
        #txCenterOffsetHz: 0

    # Single SDR device configuration.
    devices:
        # Device 0: SoapySDR-compatible SDR
        - args: "driver=rtl,index=0"

          # SDR sample rate.
          sampleRate: 960000

          # Center-frequency correction in PPM.
          freqCorrPpm: 0

          # Optional per-device tuning center offsets (Hz).
          #rxCenterOffsetHz: 25000
          #txCenterOffsetHz: 0

          # Gain controls (dB).
          rxGain: 30
          txGain: 30

          # Optional Soapy gain stage names.
          #rxGainElement: "LNA"
          #txGainElement: "VGA"

          # Optional Soapy bandwidth controls (Hz).
          #rxBandwidth: 300000
          #txBandwidth: 300000

          # Optional Soapy timing/clock source controls.
          #clockSource: "internal"
          #timeSource: "internal"

          # Optional antenna names (driver dependent; blank = default).
          #rxAntenna: ""
          #txAntenna: ""

#
# Virtual Modem Configuration
#
modems:
    - protocol:
        # UART/RS232 serial port device.
        port: /tmp/dvm0
        # UART/RS232 serial port speed. (The default speed of 115200, should not be
        # changed unless the speed is also changed in the firmware of the modem.)
        speed: 115200

      #
      # SDR Radio
      #
      radio:
        # Single-device assignment (1:1 modem to SDR).
        device: 0

#
# System Configuration
#
system:
    # Flag indicating whether or not verbose logging is enabled.
    verbose: true
    # Flag indicating whether or not debug logging is enabled.
    debug: false
