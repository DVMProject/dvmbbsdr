#
# Digital Voice Modem - SDR Software Configuration
#

# Flag indicating whether the host will run as a background or foreground task.
daemon: true

#
# Logging Configuration
#
#   Logging Levels:
#     1 - Debug
#     2 - Informational
#     3 - Warning
#     4 - Error
#     5 - Fatal
#
log:
    # Console display logging level (used when in foreground).
    displayLevel: 1
    # File logging level.
    fileLevel: 1
    # Flag indicating file logs should be sent to syslog instead of a file.
    useSyslog: false
    # Full path for the directory to store the log files.
    filePath: .
    # Log filename prefix.
    fileRoot: DVMSDR

#
# SDR RF Runtime Configuration
#
sdr:
    # osmosdr device selection string.
    # Format: "driver=<backend>[,key=value,...]"
    # Common backends include:
    #   - rtl            (RTL-SDR)
    #   - hackrf         (HackRF)
    #   - bladerf        (bladeRF)
    #   - airspy         (Airspy)
    #   - soapy          (SoapySDR bridge)
    #   - uhd            (USRP via UHD)
    #
    # Common selectors/keys (driver dependent):
    #   serial=..., index=..., device=..., type=..., addr=..., antenna=...
    #
    # Examples:
    #   RTL-SDR (first dongle):
    #     args: "driver=rtl,index=0"
    #   RTL-SDR (specific serial):
    #     args: "driver=rtl,serial=00000001"
    #   HackRF:
    #     args: "driver=hackrf"
    #   bladeRF by serial:
    #     args: "driver=bladerf,serial=5519595f67984f95"
    #   USRP over network:
    #     args: "driver=uhd,addr=192.168.10.2"
    #   Soapy LimeSDR:
    #     args: "driver=soapy,device=lime"

    # Optional fallback values used when fields are omitted in individual devices.
    defaults:
        # Wideband sample rate used for channelization and multi-carrier operation.
        sampleRate: 960000

        # Gain controls (dB).
        rxGain: 30
        txGain: 30

        # Center-frequency correction in PPM.
        freqCorrPpm: 0

        # Optional: publish wideband RX IQ samples to ZeroMQ for external FFT viewers.
        # Empty string disables export.
        # Example: "tcp://127.0.0.1:5557"
        #rxIqTapAddress: "tcp://127.0.0.1:5557"
        # Optional PUB topic prefix. Leave empty to publish without topic framing.
        #rxIqTapTopic: ""

    # Wideband channelization and transmission settings.
    # Rebuild-free hot retune is used when only channel frequencies change.
    devices:
        # Device 0: RTL-SDR (RX-only)
        - args: "driver=rtl,index=0"

          # Wideband sample rate used for channelization and multi-carrier operation.
          sampleRate: 960000

          # Center-frequency correction in PPM.
          freqCorrPpm: 0

          # Gain controls (dB).
          rxGain: 30
          txGain: 30

          # Optional antenna names (driver dependent; blank = default).
          #rxAntenna: ""
          #txAntenna: ""

          # Optional frontend bandwidth hints (Hz); 0 = automatic.
          #rxBandwidth: 0
          #txBandwidth: 0

          # Optional per-device override for RX IQ ZeroMQ export tap.
          #rxIqTapAddress: "tcp://127.0.0.1:5557"
          #rxIqTapTopic: "sdr0"

        # Device 1: USRP (TX+RX capable)
        - args: "driver=uhd,addr=192.168.10.2"

          # Wideband sample rate used for channelization and multi-carrier operation.
          sampleRate: 960000

          # Center-frequency correction in PPM.
          freqCorrPpm: 0

          # Gain controls (dB).
          rxGain: 30
          txGain: 30

          # Optional antenna names (driver dependent; blank = default).
          rxAntenna: ""
          txAntenna: ""

          # Optional frontend bandwidth hints (Hz); 0 = automatic.
          #rxBandwidth: 0
          #txBandwidth: 0

          # Optional per-device override for RX IQ ZeroMQ export tap.
          #rxIqTapAddress: "tcp://127.0.0.1:5558"
          #rxIqTapTopic: "sdr1"

    # Optional runtime status publisher for live SDR center/sample-rate updates over ZeroMQ.
    # This avoids filesystem polling and is preferred for dynamic retune visualization.
    #runtimeStatusPubAddress: "tcp://127.0.0.1:5567"
    #runtimeStatusPubTopic: "radio-state"

#
# Virtual Modem Configuration
#
modems:
    - protocol:
        # UART/RS232 serial port device.
        port: /tmp/dvm0
        # UART/RS232 serial port speed. (The default speed of 115200, should not be
        # changed unless the speed is also changed in the firmware of the modem.)
        speed: 115200

      #
      # SDR Radio
      #
      radio:
        # Single-device assignment (applies to both RX and TX if rxDevice/txDevice are not set).
        device: 0
        # Optional explicit split assignment. Useful when RX SDR is receive-only (for example RTL-SDR).
        #rxDevice: 0
        #txDevice: 1
    - protocol:
        # UART/RS232 serial port device.
        port: /tmp/dvm1
        # UART/RS232 serial port speed. (The default speed of 115200, should not be
        # changed unless the speed is also changed in the firmware of the modem.)
        speed: 115200

      #
      # SDR Radio
      #
      radio:
        # Single-device assignment (applies to both RX and TX if rxDevice/txDevice are not set).
        device: 0
        # Optional explicit split assignment. Useful when RX SDR is receive-only (for example RTL-SDR).
        #rxDevice: 0
        #txDevice: 1

#
# System Configuration
#
system:
    # Flag indicating whether or not verbose logging is enabled.
    verbose: true
    # Flag indicating whether or not debug logging is enabled.
    debug: false
